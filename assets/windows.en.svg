<svg xmlns="http://www.w3.org/2000/svg" width="240" height="62" viewBox="0 0 240 62" role="img" aria-label="Windows — Microsoft Store">
<title>Windows — Microsoft Store</title>
<defs>
  <clipPath id="button"><rect x="1" y="1" width="238" height="60" rx="12"/></clipPath>
  <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .shine { animation: sweep 9s ease-in-out 0s infinite; transform: translateX(-100px); opacity: 0; }
  .arrow { animation: nudge 9s ease-in-out 0s infinite; }
  @keyframes sweep { 0%,3% { transform: translateX(-100px); opacity: 0; } 5% { opacity: 1; } 22% { transform: translateX(340px); opacity: 0; } 100% { transform: translateX(340px); opacity: 0; } }
  @keyframes nudge { 0%,24%,100% { transform: translateX(0); } 12% { transform: translateX(2px); } }
  @media (prefers-reduced-motion: reduce) { .shine { display: none; animation: none; } .arrow { animation: none; } }
</style>
<rect x="1" y="1" width="238" height="60" rx="12" fill="#7762ee" stroke="#a48bff"/>
<g clip-path="url(#button)"><rect class="shine" x="0" y="-20" width="70" height="104" fill="url(#shine)"/></g>
<path d="M22 19H32V29H22ZM35 19H45V29H35ZM22 32H32V42H22ZM35 32H45V42H35Z" fill="#fff"/>
<text x="61" y="23" fill="#e0dceb" font-size="10" letter-spacing="1.8" font-family="Arial,sans-serif">WINDOWS</text>
<text x="60" y="43" fill="#fff" font-size="17" font-weight="700" font-family="Arial,sans-serif">Microsoft Store</text>
<path class="arrow" d="M211 27L217 31L211 35" stroke="#fff" fill="none" stroke-width="1.5"/>
</svg>
