<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="The Training Arc — Her proje bir seviye, her hata bir antrenman."><defs><linearGradient id="bg"><stop stop-color="#171329"/><stop offset="1" stop-color="#10121c"/></linearGradient></defs><rect x="1" y="1" width="1198" height="198" rx="18" fill="url(#bg)" stroke="#30283f"/><rect x="34" y="37" width="3" height="126" rx="1.5" fill="#9d84ff"/><text x="58" y="56" font-family="Arial,sans-serif" fill="#ad99ef" font-size="13" letter-spacing="3">THE TRAINING ARC</text><text x="58" y="100" font-family="Arial,sans-serif" fill="#bcb8ce" font-size="23">Bu proje, sürekli öğrenip geliştiğim kişisel yolculuğumun bir parçası.</text><text x="58" y="140" font-family="Arial,sans-serif" fill="#f3eeff" font-size="26" font-weight="700">Her proje bir seviye, her hata bir antrenman.</text></svg>